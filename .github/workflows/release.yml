name: Release

# Publishes each new version by itself, to addons.mozilla.org (listed) and the Chrome Web Store.
# `npm run release -- patch` makes the commit "Release x.y.z"; pushing it to main is all it takes.
# A version is released once: the run tags it vX.Y.Z, and a version that already has a tag is skipped.
# Each store is skipped while its secrets are missing (docs/RELEASING.md). Chrome refuses an upload while an
# earlier version is still in review; the run carries on, and "Run workflow" with store = chrome sends it later.
on:
  push:
    branches: [main]
    paths: ['manifest.json']
  workflow_dispatch:
    inputs:
      store:
        description: Which store
        type: choice
        options: [all, chrome]
        default: all

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      MOZILLA_GITHUB: ${{ secrets.MOZILLA_GITHUB }}
      CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          version="$(jq -r .version manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error title=Versions differ::package.json and manifest.json disagree. Release with npm run release."
            exit 1
          fi
          if [ "${{ inputs.store }}" != chrome ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22
        if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Build and check
        if: steps.v.outputs.skip != 'true'
        run: |
          npm ci
          npm run lint
          npm test
          npm run verify:package
          npm run build:listed
          npm run build:chrome
          node tools/amo-metadata.mjs "${{ steps.v.outputs.version }}" > "$RUNNER_TEMP/amo-metadata.json"
          mkdir -p "$RUNNER_TEMP/listed"
          unzip -q "web-ext-artifacts/at-peace-${{ steps.v.outputs.version }}-listed.zip" -d "$RUNNER_TEMP/listed"

      - name: Mozilla credentials
        id: amo
        if: steps.v.outputs.skip != 'true' && inputs.store != 'chrome' && (env.AMO_JWT_ISSUER != '' || env.MOZILLA_GITHUB != '')
        run: |
          node tools/check-release-setup.mjs --mozilla-only --export
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: addons.mozilla.org
        if: steps.amo.outputs.ok == 'true'
        run: >
          npx web-ext sign --source-dir "$RUNNER_TEMP/listed" --artifacts-dir "$RUNNER_TEMP/signed"
          --channel listed --amo-metadata "$RUNNER_TEMP/amo-metadata.json" --approval-timeout 0
          --api-key "$AMO_ISSUER" --api-secret "$AMO_SECRET" --no-input

      - name: Chrome Web Store
        continue-on-error: true
        if: steps.v.outputs.skip != 'true' && env.CWS_SERVICE_ACCOUNT != '' && env.CWS_EXTENSION_ID != ''
        run: node tools/cws-publish.mjs "web-ext-artifacts/at-peace-${{ steps.v.outputs.version }}-chrome.zip"

      - name: Tag the release
        if: steps.v.outputs.skip != 'true' && inputs.store != 'chrome'
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
