<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>At Peace</title>
  <link rel="stylesheet" href="../common/tokens.css">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="../common/indigo.css">
  <link rel="stylesheet" href="blocked.css">
  <script src="../common/theme-boot.js"></script>
</head>
<body class="indigo" data-state="loading">
  <div class="page">
    <header class="top">
      <h1 class="wordmark"><span class="glyph" aria-hidden="true"></span>At Peace</h1>
    </header>

    <main class="stage">
      <!-- The dial (drawn by blocked.js): ticks, and an amber arc for the time that is left. -->
      <div class="dial ring" id="dial" aria-hidden="true"></div>

      <div class="copy" id="column">
        <p class="kicker is-amber" id="kicker"></p>
        <h2 class="title headline" id="title"></h2>

        <div class="time" id="time" hidden>
          <p class="clock mono" id="clock" role="timer" aria-live="off"></p>
          <p class="until lede" id="until"></p>
        </div>

        <div class="cta" id="cta"></div>
        <section class="unlock" id="unlock" aria-label="Ending this early"></section>
        <p class="note" id="note" role="status"></p>
      </div>
    </main>
  </div>

  <!-- Shared classic scripts, in the same order as the YouTube content script (manifest.json). -->
  <script src="../../shared/namespace.js"></script>
  <script src="../../shared/browser-api.js"></script>
  <script src="../../shared/util.js"></script>
  <script src="../../shared/messages.js"></script>
  <script src="../../shared/schema-core.js"></script>
  <script src="../../shared/schema/general.js"></script>
  <script src="../../shared/schema/pause.js"></script>
  <script src="../../shared/schema/focus.js"></script>
  <script src="../../shared/schema/advanced.js"></script>
  <script src="../../sites/youtube/schema/general.js"></script>
  <script src="../../sites/youtube/schema/masthead.js"></script>
  <script src="../../sites/youtube/schema/guide.js"></script>
  <script src="../../sites/youtube/schema/home.js"></script>
  <script src="../../sites/youtube/schema/watch.js"></script>
  <script src="../../sites/youtube/schema/player.js"></script>
  <script src="../../sites/youtube/schema/comments.js"></script>
  <script src="../../sites/youtube/schema/search.js"></script>
  <script src="../../sites/youtube/schema/shorts.js"></script>
  <script src="../../sites/youtube/schema/subscriptions.js"></script>
  <script src="../../sites/youtube/schema/channel.js"></script>
  <script src="../../sites/youtube/schema/filters.js"></script>
  <script src="../../shared/presets.js"></script>
  <script src="../../shared/settings.js"></script>
  <script src="../../shared/state.js"></script>
  <script src="../../shared/lock.js"></script>
  <script src="../common/logic.js"></script>
  <script src="../common/components.js"></script>
  <script src="../common/lock-ui.js"></script>
  <script type="module" src="blocked.js"></script>
</body>
</html>
